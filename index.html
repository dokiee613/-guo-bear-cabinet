<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef4f5">
<title>我的柜子</title>
<style>
:root{--bg:#edf3f3;--glass:rgba(255,255,255,.60);--glass2:rgba(255,255,255,.82);--line:rgba(255,255,255,.82);--text:#27353d;--muted:#87959b;--accent:#7d93c5;--danger:#c77f8e;--shadow:0 14px 38px rgba(65,84,94,.10);--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 7% 7%,rgba(177,211,204,.48),transparent 28%),radial-gradient(circle at 95% 10%,rgba(202,191,226,.43),transparent 27%),radial-gradient(circle at 70% 100%,rgba(181,210,231,.38),transparent 30%),var(--bg);min-height:100vh;padding-bottom:84px}
button,input,textarea,select{font:inherit}button{border:0;color:inherit;cursor:pointer}
.app{max-width:1080px;margin:auto;padding:23px 15px 35px}
.page{display:none}.page.active{display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.brand h1{font-size:27px;margin:0 0 4px;letter-spacing:-.7px}.brand p{margin:0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:7px}
.icon-btn,.soft-btn{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 7px 20px rgba(75,91,105,.07);border-radius:14px;min-height:39px;padding:0 12px}.icon-btn{width:40px;padding:0;font-size:20px}.soft-btn{font-size:12px}
.hero{background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(239,247,247,.50));border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:27px;padding:19px;box-shadow:var(--shadow);margin-bottom:14px}.hero-top{display:flex;justify-content:space-between;align-items:end;gap:10px}.hero-label{font-size:10px;color:var(--muted);letter-spacing:1.1px}.total{font-size:29px;font-weight:700;letter-spacing:-.7px;margin-top:4px}.total small{font-size:13px;color:var(--muted)}.hero-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.pill{padding:6px 9px;border-radius:11px;background:rgba(255,255,255,.55);font-size:11px;color:#68777e}
.toolbar{display:flex;gap:7px;margin:13px 0 9px;align-items:center}.search{flex:1;position:relative}.search input,.field input,.field textarea,.field select{width:100%;border:1px solid rgba(255,255,255,.82);outline:none;background:rgba(255,255,255,.58);border-radius:14px;padding:10px 12px;color:var(--text)}.search input{padding-left:34px}.search span{position:absolute;left:12px;top:8px;color:var(--muted)}.groups{display:flex;gap:7px;overflow:auto;padding:1px 1px 7px;scrollbar-width:none}.groups::-webkit-scrollbar{display:none}.group{flex:0 0 auto;padding:8px 11px;border-radius:13px;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.72);color:#68777e;font-size:11px}.group.active{background:rgba(255,255,255,.9);color:#435a76;box-shadow:0 5px 15px rgba(80,100,115,.08)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.card{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:15px;box-shadow:0 8px 22px rgba(75,91,105,.07);cursor:pointer;transition:.15s transform}.card:active{transform:scale(.97)}.cover{aspect-ratio:1/1;background:linear-gradient(145deg,#e8eeee,#f7f8f7);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.noimg{height:100%;display:flex;align-items:center;justify-content:center;font-size:23px;color:#a7b4b8}.card-body{padding:7px 8px 8px}.card-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-sub{font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-price{font-size:10px;margin-top:5px}.fav{position:absolute;right:4px;top:4px;z-index:4;width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);font-size:13px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}.selectbox{position:absolute;left:5px;top:5px;z-index:4;width:21px;height:21px;border-radius:7px;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;font-size:13px}.selecting .selectbox{display:flex}.card.selected{outline:2px solid rgba(125,147,197,.65)}.card.selected .selectbox{background:#8198c5;color:white}.empty{text-align:center;padding:60px 20px;color:var(--muted);background:rgba(255,255,255,.34);border:1px dashed rgba(160,175,180,.35);border-radius:22px}.empty .big{font-size:32px;margin-bottom:8px}
.bulkbar{display:none;position:sticky;bottom:82px;z-index:9;margin:12px 0;padding:9px;background:rgba(247,250,249,.9);border:1px solid white;border-radius:17px;backdrop-filter:blur(20px);box-shadow:var(--shadow);align-items:center;gap:7px}.bulkbar.show{display:flex}.bulkbar .countsel{font-size:11px;color:var(--muted);margin-right:auto}.bulkbar button{padding:8px 10px;border-radius:11px;background:rgba(225,233,233,.72);font-size:11px}.bulkbar .del{color:#ad6676;background:rgba(201,139,151,.13)}
.modal-wrap{position:fixed;inset:0;background:rgba(42,55,62,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal-wrap.show{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:rgba(248,251,250,.94);border:1px solid rgba(255,255,255,.95);border-radius:27px 27px 0 0;box-shadow:0 -15px 60px rgba(60,75,84,.17);padding:16px 16px 28px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modal-head h2{font-size:17px;margin:0}.close{width:34px;height:34px;border-radius:50%;background:rgba(225,232,232,.72);font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px 3px}.field textarea{min-height:84px;resize:vertical}.preview{width:100%;aspect-ratio:16/9;border-radius:17px;overflow:hidden;background:#e9eeee;margin-bottom:10px;position:relative}.preview img{width:100%;height:100%;object-fit:contain}.upload{display:flex;gap:7px;align-items:center;justify-content:center;padding:10px;border-radius:14px;background:rgba(225,233,233,.65);color:#64747a;font-size:12px;margin-bottom:12px}.actions{display:flex;gap:8px;margin-top:16px}.primary,.danger,.secondary{flex:1;padding:11px;border-radius:14px;font-size:12px}.primary{background:linear-gradient(135deg,#8198c5,#9aaed0);color:white}.secondary{background:rgba(224,232,232,.72)}.danger{background:rgba(201,139,151,.13);color:#ad6676}
.detail-cover{width:100%;max-height:52vh;object-fit:contain;border-radius:18px;background:#edf1f1;margin-bottom:13px}.detail-title{font-size:21px;font-weight:700;margin-bottom:3px}.detail-group{font-size:11px;color:var(--muted);margin-bottom:13px}.detail-price{font-size:18px;font-weight:650;margin-bottom:14px}.info-list{display:grid;gap:7px}.info-row{display:flex;justify-content:space-between;gap:15px;padding:10px 12px;border-radius:13px;background:rgba(235,241,241,.6);font-size:12px}.info-row span:first-child{color:var(--muted)}
.settings-list{display:grid;gap:9px}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:rgba(235,241,241,.55);border-radius:15px}.setting b{font-size:13px}.setting small{color:var(--muted);display:block;margin-top:3px;font-size:10px}.manage-group-list{display:grid;gap:7px;margin-bottom:13px}.manage-group{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:13px;background:rgba(235,241,241,.62)}.manage-group .name{flex:1;font-size:12px}.mini{padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.75);font-size:10px}.mini.del{color:#ad6676}
.profile-card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);border-radius:25px;padding:22px;box-shadow:var(--shadow);text-align:center}.avatar{width:105px;height:105px;border-radius:50%;margin:0 auto 13px;background:linear-gradient(135deg,#dce8e7,#e4e0ef);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:35px;color:#9ba8ac}.avatar img{width:100%;height:100%;object-fit:cover}.profile-name{font-size:20px;font-weight:700}.bio{color:var(--muted);font-size:12px;line-height:1.7;margin:6px auto 15px;max-width:460px;white-space:pre-wrap}.profile-stats{display:flex;justify-content:center;gap:30px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted)}.section-title{font-size:14px;font-weight:650;margin:20px 2px 9px}
.diary-add{width:100%;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:13px;color:var(--muted);font-size:12px}.diary-list{display:grid;gap:9px}.diary-card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 7px 20px rgba(75,91,105,.06);cursor:pointer}.diary-date{font-size:10px;color:var(--muted);margin-bottom:6px}.diary-title{font-size:14px;font-weight:650;margin-bottom:5px}.diary-text{font-size:12px;line-height:1.7;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.bottom-nav{position:fixed;left:50%;bottom:13px;transform:translateX(-50%);z-index:15;width:min(430px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);padding:6px;background:rgba(247,250,249,.78);border:1px solid rgba(255,255,255,.92);border-radius:22px;backdrop-filter:blur(24px);box-shadow:0 12px 38px rgba(64,81,91,.15)}.nav-item{background:transparent;border-radius:17px;padding:7px 4px;font-size:10px;color:var(--muted)}.nav-item .ico{display:block;font-size:17px;line-height:18px;margin-bottom:2px}.nav-item.active{background:rgba(255,255,255,.78);color:#526b91}
.toast{position:fixed;left:50%;bottom:87px;transform:translateX(-50%) translateY(12px);background:rgba(40,51,57,.9);color:white;padding:9px 13px;border-radius:13px;font-size:11px;opacity:0;pointer-events:none;transition:.22s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:560px){.app{padding:18px 11px 30px}.brand h1{font-size:25px}.hero{padding:16px;border-radius:23px}.total{font-size:27px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{border-radius:12px}.card-body{padding:6px 6px 7px}.card-name{font-size:10px}.card-sub{font-size:8px}.card-price{font-size:9px;margin-top:4px}.fav{width:23px;height:23px;font-size:12px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:15px 13px 25px}}
</style>
</head>
<body>
<div class="app">

<section id="cabinetPage" class="page active">
<header class="top"><div class="brand"><h1>我的柜子</h1><p>把喜欢的东西，好好收起来</p></div><div class="top-actions"><button class="icon-btn" id="addBtn">＋</button><button class="icon-btn" id="menuBtn">⋯</button></div></header>
<section class="hero"><div class="hero-top"><div><div class="hero-label">COLLECTION VALUE</div><div class="total">¥ <span id="total">0.00</span></div></div><button class="soft-btn" id="quickAdd">添加物品</button></div><div class="hero-meta"><span class="pill">共 <b id="count">0</b> 件</span><span class="pill">分组 <b id="groupCount">0</b> 个</span><span class="pill">收藏 <b id="favCount">0</b> 件</span></div></section>
<div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="搜索物品名称、备注…"></div><button class="soft-btn" id="selectBtn">多选</button><button class="soft-btn" id="sortBtn">最新</button></div>
<div class="groups" id="groups"></div>
<div class="bulkbar" id="bulkbar"><span class="countsel">已选 <b id="selectedCount">0</b> 件</span><button id="bulkMove">移动</button><button id="bulkDelete" class="del">删除</button><button id="cancelSelect">取消</button></div>
<main id="list"></main>
</section>

<section id="diaryPage" class="page">
<header class="top"><div class="brand"><h1>我的日记</h1><p>记录今天，也留住从前</p></div><button class="icon-btn" id="addDiary">＋</button></header>
<button class="diary-add" id="quickDiary">＋ 写一篇今天的日记</button>
<div class="section-title">全部日记</div><main class="diary-list" id="diaryList"></main>
</section>

<section id="profilePage" class="page">
<header class="top"><div class="brand"><h1>个人资料</h1><p>属于你自己的小角落</p></div><button class="icon-btn" id="editProfile">✎</button></header>
<div class="profile-card"><div class="avatar" id="profileAvatar">♡</div><div class="profile-name" id="profileName">未命名</div><div class="bio" id="profileBio">写一点关于自己的话吧</div><div class="profile-stats"><div class="stat"><b id="pItems">0</b><span>收藏</span></div><div class="stat"><b id="pValue">¥0</b><span>总价值</span></div><div class="stat"><b id="pDiary">0</b><span>日记</span></div></div></div>
<div class="section-title">数据</div><div class="setting" style="background:var(--glass);border:1px solid var(--line)"><div><b>备份与恢复</b><small>物品、图片、分组、资料、日记全部保存</small></div><button class="soft-btn" id="profileBackup">管理</button></div>
</section>
</div>

<nav class="bottom-nav"><button class="nav-item active" data-page="cabinetPage"><span class="ico">⌂</span>柜子</button><button class="nav-item" data-page="diaryPage"><span class="ico">♡</span>日记</button><button class="nav-item" data-page="profilePage"><span class="ico">○</span>我的</button></nav>

<div class="modal-wrap" id="formModal"><div class="modal"><div class="modal-head"><h2 id="formTitle">添加物品</h2><button class="close" data-close="formModal">×</button></div><div class="preview" id="preview"><div class="noimg">＋</div></div><label class="upload">＋ 上传图片<input id="imageInput" type="file" accept="image/*" hidden></label><div class="form-grid"><div class="field"><label>名称 *</label><input id="name" placeholder="比如：夏以昼"></div><div class="field"><label>价格</label><input id="price" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>分组</label><select id="group"></select></div><div class="field"><label>购买日期</label><input id="date" type="date"></div><div class="field full"><label>备注</label><textarea id="note" placeholder="想记录什么都可以…"></textarea></div></div><div class="actions"><button class="secondary" data-close="formModal">取消</button><button class="primary" id="saveBtn">保存</button></div></div></div>

<div class="modal-wrap" id="detailModal"><div class="modal"><div class="modal-head"><h2>物品详情</h2><button class="close" data-close="detailModal">×</button></div><div id="detail"></div></div></div>

<div class="modal-wrap" id="settingsModal"><div class="modal"><div class="modal-head"><h2>柜子设置</h2><button class="close" data-close="settingsModal">×</button></div><div class="settings-list"><div class="setting"><div><b>管理分组</b><small>自定义、新建、改名、删除分组</small></div><button class="soft-btn" id="manageGroups">管理</button></div><div class="setting"><div><b>导出完整备份</b><small>所有图片也会一起备份</small></div><button class="soft-btn" id="exportBtn">导出</button></div><div class="setting"><div><b>恢复完整备份</b><small>会覆盖当前数据</small></div><button class="soft-btn" id="importBtn">导入</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><div class="setting"><div><b>清空全部数据</b><small>请确认已经备份</small></div><button class="danger" style="flex:0 0 auto;padding:8px 11px" id="clearBtn">清空</button></div></div></div></div>

<div class="modal-wrap" id="groupModal"><div class="modal"><div class="modal-head"><h2>管理分组</h2><button class="close" data-close="groupModal">×</button></div><div class="field" style="display:flex;gap:7px;margin-bottom:12px"><input id="newGroup" placeholder="输入新分组名称"><button class="primary" style="flex:0 0 auto;padding:10px 14px" id="addGroup">新建</button></div><div class="manage-group-list" id="groupManageList"></div></div></div>

<div class="modal-wrap" id="profileModal"><div class="modal"><div class="modal-head"><h2>编辑个人资料</h2><button class="close" data-close="profileModal">×</button></div><div class="preview" style="aspect-ratio:1/1;max-width:180px;margin:0 auto 10px" id="profilePreview"><div class="noimg">♡</div></div><label class="upload">＋ 上传头像<input id="avatarInput" type="file" accept="image/*" hidden></label><div class="field"><label>昵称</label><input id="profileNameInput" placeholder="你的名字"></div><div class="field" style="margin-top:10px"><label>个人简介</label><textarea id="profileBioInput" placeholder="写一点关于自己的话吧"></textarea></div><div class="actions"><button class="secondary" data-close="profileModal">取消</button><button class="primary" id="saveProfile">保存</button></div></div></div>

<div class="modal-wrap" id="diaryModal"><div class="modal"><div class="modal-head"><h2 id="diaryTitle">写日记</h2><button class="close" data-close="diaryModal">×</button></div><div class="field"><label>日期（修改旧日记时保持原日期）</label><input id="diaryDate" type="date"></div><div class="field" style="margin-top:10px"><label>标题</label><input id="diaryName" placeholder="今天发生了什么"></div><div class="field" style="margin-top:10px"><label>内容</label><textarea id="diaryText" style="min-height:220px" placeholder="写下来吧…"></textarea></div><div class="actions"><button class="secondary" data-close="diaryModal">取消</button><button class="primary" id="saveDiary">保存日记</button></div></div></div>

<div class="toast" id="toast"></div>
<script>
const KEY="my-cabinet-v3";
const FAV_GROUP="收藏";
const DEFAULT_GROUPS=["娃娃","体子","衣服","鞋子","袜子","配饰","其他"];
let state={items:[],groups:DEFAULT_GROUPS.slice(),diaries:[],profile:{name:"",bio:"",avatar:""}};
let currentGroup="全部",editingId=null,tempImage=null,sortMode="latest",selectMode=false,selected=new Set(),editingDiaryId=null,tempAvatar=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=n=>(Number(n)||0).toFixed(2);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast("保存失败：浏览器存储空间可能已满")}}
function load(){
 try{
  let x=JSON.parse(localStorage.getItem(KEY));
  if(x){state={items:Array.isArray(x.items)?x.items:[],groups:Array.isArray(x.groups)?x.groups:DEFAULT_GROUPS.slice(),diaries:Array.isArray(x.diaries)?x.diaries:[],profile:x.profile||{name:"",bio:"",avatar:""}};
  }
 }catch(e){}
 state.groups=[...new Set(state.groups.filter(x=>x&&x!==FAV_GROUP))];
}
function open(id){$("#"+id).classList.add("show")}
function close(id){$("#"+id).classList.remove("show")}
function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove("show"),1700)}
function isFav(x){return !!x.fav}
function render(){
 let total=state.items.reduce((a,b)=>a+(Number(b.price)||0),0);
 $("#total").textContent=money(total);$("#count").textContent=state.items.length;$("#groupCount").textContent=state.groups.length+1;$("#favCount").textContent=state.items.filter(isFav).length;
 renderGroups();renderList();renderDiary();renderProfile();
}
function renderGroups(){
 let html=`<button class="group ${currentGroup==="全部"?"active":""}" data-group="全部">全部 · ${state.items.length}</button><button class="group ${currentGroup===FAV_GROUP?"active":""}" data-group="${FAV_GROUP}">♥ 收藏 · ${state.items.filter(isFav).length}</button>`;
 state.groups.forEach(g=>{let n=state.items.filter(x=>x.group===g).length;html+=`<button class="group ${currentGroup===g?"active":""}" data-group="${esc(g)}">${esc(g)} · ${n}</button>`});
 $("#groups").innerHTML=html;$("#groups").querySelectorAll(".group").forEach(b=>b.onclick=()=>{currentGroup=b.dataset.group;selected.clear();updateBulk();renderGroups();renderList()});
}
function filtered(){
 let q=$("#search").value.trim().toLowerCase();
 let arr=state.items.filter(x=>{
  let groupOK=currentGroup==="全部"||(currentGroup===FAV_GROUP?isFav(x):x.group===currentGroup);
  let qOK=!q||[x.name,x.note,x.group].join(" ").toLowerCase().includes(q);return groupOK&&qOK
 });
 arr.sort((a,b)=>sortMode==="price"?(Number(b.price)||0)-(Number(a.price)||0):sortMode==="name"?a.name.localeCompare(b.name):b.created-a.created);return arr
}
function card(x){
 let checked=selected.has(x.id);
 return `<article class="card ${selectMode?"selecting ":""}${checked?"selected":""}" data-id="${x.id}">
 <button type="button" class="selectbox" data-select="${x.id}">${checked?"✓":""}</button>
 <button type="button" class="fav" data-fav="${x.id}">${x.fav?"♥":"♡"}</button>
 <div class="cover">${x.image?`<img src="${x.image}" alt="">`:`<div class="noimg">✦</div>`}</div>
 <div class="card-body"><div class="card-name">${esc(x.name)}</div><div class="card-sub">${esc(x.group||"其他")}</div><div class="card-price">¥ ${money(x.price)}</div></div></article>`
}
function renderList(){
 let arr=filtered();
 if(!arr.length){$("#list").innerHTML=`<div class="empty"><div class="big">🧺</div><div>这里还空空的</div><div style="font-size:11px;margin-top:5px">点右上角 ＋，把喜欢的东西放进来吧</div></div>`;return}
 $("#list").innerHTML=`<div class="grid">${arr.map(card).join("")}</div>`;
 $("#list").querySelectorAll(".card").forEach(c=>c.addEventListener("click",e=>{if(e.target.closest(".fav")||e.target.closest(".selectbox"))return;if(selectMode){toggleSelect(c.dataset.id)}else showDetail(c.dataset.id)}));
 $("#list").querySelectorAll("[data-fav]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();let x=state.items.find(x=>x.id===b.dataset.fav);if(x){x.fav=!x.fav;save();render();toast(x.fav?"已加入收藏":"已取消收藏")}}));
 $("#list").querySelectorAll("[data-select]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();toggleSelect(b.dataset.select)}));
}
function toggleSelect(id){if(selected.has(id))selected.delete(id);else selected.add(id);updateBulk();renderList()}
function updateBulk(){$("#selectedCount").textContent=selected.size;$("#bulkbar").classList.toggle("show",selectMode);$("#bulkbar").classList.toggle("show",selectMode);if(selectMode)$("#selectBtn").textContent="完成";else $("#selectBtn").textContent="多选"}
function openForm(id=null){
 editingId=id;tempImage=null;$("#formTitle").textContent=id?"编辑物品":"添加物品";let x=id?state.items.find(x=>x.id===id):null;
 $("#name").value=x?.name||"";$("#price").value=x?.price??"";$("#note").value=x?.note||"";$("#date").value=x?.date||new Date().toISOString().slice(0,10);
 $("#group").innerHTML=state.groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("");
 $("#group").value=x?.group||state.groups[0]||"其他";tempImage=x?.image||null;renderPreview();open("formModal")
}
function renderPreview(){$("#preview").innerHTML=tempImage?`<img src="${tempImage}" alt="">`:`<div class="noimg">＋</div>`}
$("#imageInput").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{tempImage=r.result;renderPreview();save()};r.readAsDataURL(f)}
$("#saveBtn").onclick=()=>{
 let name=$("#name").value.trim();if(!name){toast("请先写个名字呀");return}
 let old=editingId?state.items.find(x=>x.id===editingId):null;
 let item={id:editingId||crypto.randomUUID(),name,price:Number($("#price").value)||0,group:$("#group").value||"其他",date:$("#date").value,note:$("#note").value.trim(),image:tempImage||"",fav:old?.fav||false,created:old?.created||Date.now()};
 if(editingId){let i=state.items.findIndex(x=>x.id===editingId);state.items[i]=item}else state.items.unshift(item);
 save();close("formModal");render();toast(editingId?"修改已自动保存":"已自动保存")
}
function showDetail(id){
 let x=state.items.find(x=>x.id===id);if(!x)return;
 $("#detail").innerHTML=`${x.image?`<img class="detail-cover" src="${x.image}">`:``}<div class="detail-title">${esc(x.name)}</div><div class="detail-group">${esc(x.group||"其他")} · ${x.fav?"已收藏":"未收藏"}</div><div class="detail-price">¥ ${money(x.price)}</div><div class="info-list">${x.date?`<div class="info-row"><span>购买日期</span><b>${esc(x.date)}</b></div>`:""}${x.note?`<div class="info-row" style="display:block"><span>备注</span><div style="margin-top:6px;line-height:1.65">${esc(x.note)}</div></div>`:""}</div><div class="actions"><button class="secondary" id="editItem">编辑</button><button class="secondary" id="moveItem">移动分组</button><button class="danger" id="deleteItem">删除</button></div>`;
 open("detailModal");$("#editItem").onclick=()=>{close("detailModal");openForm(id)};$("#moveItem").onclick=()=>moveOne(id);$("#deleteItem").onclick=()=>{if(confirm("确定删除吗？")){state.items=state.items.filter(a=>a.id!==id);save();close("detailModal");render();toast("已自动保存删除")}}
}
function moveOne(id){let x=state.items.find(x=>x.id===id);if(!x)return;let g=prompt("移动到哪个分组？",x.group||"");if(g===null)return;g=g.trim();if(!g)return;if(!state.groups.includes(g)){state.groups.push(g)}x.group=g;save();close("detailModal");render();toast("已移动并自动保存")}
function manageGroups(){
 renderGroupManage();open("groupModal")
}
function renderGroupManage(){
 $("#groupManageList").innerHTML=state.groups.map(g=>`<div class="manage-group"><span class="name">${esc(g)} <small style="color:var(--muted)">(${state.items.filter(x=>x.group===g).length})</small></span><button class="mini" data-rename="${esc(g)}">改名</button><button class="mini del" data-delgroup="${esc(g)}">删除</button></div>`).join("")+
 `<div class="manage-group" style="background:rgba(220,230,230,.35)"><span class="name">♥ 收藏 <small style="color:var(--muted)">(${state.items.filter(isFav).length})</small></span><small style="color:var(--muted)">固定分组，不可删除/改名</small></div>`;
 $("#groupManageList").querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>{let old=b.dataset.rename,n=prompt("新分组名称",old);if(n===null)return;n=n.trim();if(!n||n===old||state.groups.includes(n))return;state.groups[state.groups.indexOf(old)]=n;state.items.forEach(x=>{if(x.group===old)x.group=n});if(currentGroup===old)currentGroup=n;save();renderGroupManage();render();toast("分组已自动保存")});
 $("#groupManageList").querySelectorAll("[data-delgroup]").forEach(b=>b.onclick=()=>{let g=b.dataset.delgroup;if(!confirm(`删除「${g}」？里面的物品会移动到其他分组`))return;let target=state.groups.find(x=>x!==g)||"其他";if(!state.groups.includes(target))state.groups.push(target);state.items.forEach(x=>{if(x.group===g)x.group=target});state.groups=state.groups.filter(x=>x!==g);if(currentGroup===g)currentGroup="全部";save();renderGroupManage();render();toast("分组已自动保存")})
}
$("#addGroup").onclick=()=>{let g=$("#newGroup").value.trim();if(!g){toast("先输入分组名称");return}if(g===FAV_GROUP||state.groups.includes(g)){toast("这个分组已经存在");return}state.groups.push(g);$("#newGroup").value="";save();renderGroupManage();render();toast("分组已自动保存")}
function openProfile(){tempAvatar=state.profile.avatar||"";$("#profileNameInput").value=state.profile.name||"";$("#profileBioInput").value=state.profile.bio||"";$("#profilePreview").innerHTML=tempAvatar?`<img src="${tempAvatar}" alt="">`:`<div class="noimg">♡</div>`;open("profileModal")}
$("#avatarInput").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{tempAvatar=r.result;$("#profilePreview").innerHTML=`<img src="${tempAvatar}" alt="">`;save()};r.readAsDataURL(f)}
$("#saveProfile").onclick=()=>{state.profile={name:$("#profileNameInput").value.trim(),bio:$("#profileBioInput").value.trim(),avatar:tempAvatar||""};save();close("profileModal");renderProfile();toast("个人资料已自动保存")}
function renderProfile(){let p=state.profile;$("#profileName").textContent=p.name||"未命名";$("#profileBio").textContent=p.bio||"写一点关于自己的话吧";$("#profileAvatar").innerHTML=p.avatar?`<img src="${p.avatar}" alt="">`:"♡";$("#pItems").textContent=state.items.length;$("#pValue").textContent="¥"+money(state.items.reduce((a,b)=>a+(Number(b.price)||0),0));$("#pDiary").textContent=state.diaries.length}
function today(){return new Date().toISOString().slice(0,10)}
function openDiary(id=null){editingDiaryId=id;let x=id?state.diaries.find(x=>x.id===id):null;$("#diaryTitle").textContent=id?"修改日记":"写日记";$("#diaryDate").value=x?.date||today();$("#diaryName").value=x?.title||"";$("#diaryText").value=x?.text||"";open("diaryModal")}
$("#saveDiary").onclick=()=>{let title=$("#diaryName").value.trim()||"无题";let text=$("#diaryText").value.trim();if(!text){toast("写点内容再保存吧");return}let old=editingDiaryId?state.diaries.find(x=>x.id===editingDiaryId):null;let d={id:editingDiaryId||crypto.randomUUID(),date:old?old.date:$("#diaryDate").value||today(),title,text,created:old?.created||Date.now(),updated:Date.now()};if(editingDiaryId){let i=state.diaries.findIndex(x=>x.id===editingDiaryId);state.diaries[i]=d}else state.diaries.unshift(d);save();close("diaryModal");renderDiary();renderProfile();toast(editingDiaryId?"日记已修改并自动保存":"日记已自动保存")}
function renderDiary(){let arr=[...state.diaries].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);$("#diaryList").innerHTML=arr.length?arr.map(x=>`<article class="diary-card" data-diary="${x.id}"><div class="diary-date">${esc(x.date)}</div><div class="diary-title">${esc(x.title)}</div><div class="diary-text">${esc(x.text)}</div></article>`).join(""):`<div class="empty"><div class="big">♡</div><div>还没有日记</div><div style="font-size:11px;margin-top:5px">把今天的小事留下来吧</div></div>`;$("#diaryList").querySelectorAll("[data-diary]").forEach(c=>c.onclick=()=>openDiary(c.dataset.diary))}
function switchPage(page){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));$("#"+page).classList.add("active");document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page!=="cabinetPage"&&selectMode){selectMode=false;selected.clear();updateBulk()}}
$("#selectBtn").onclick=()=>{selectMode=!selectMode;selected.clear();updateBulk();renderList()}
$("#cancelSelect").onclick=()=>{selectMode=false;selected.clear();updateBulk();renderList()}
$("#bulkMove").onclick=()=>{if(!selected.size){toast("先选择物品");return}let g=prompt("把选中的物品移动到哪个分组？","");if(g===null)return;g=g.trim();if(!g)return;if(g!==FAV_GROUP&&!state.groups.includes(g))state.groups.push(g);selected.forEach(id=>{let x=state.items.find(x=>x.id===id);if(x)x.group=g});save();toast("批量移动已自动保存");selected.clear();selectMode=false;updateBulk();render()}
$("#bulkDelete").onclick=()=>{if(!selected.size){toast("先选择物品");return}if(!confirm(`确定删除选中的 ${selected.size} 件物品吗？`))return;state.items=state.items.filter(x=>!selected.has(x.id));save();toast("批量删除已自动保存");selected.clear();selectMode=false;updateBulk();render()}
$("#search").oninput=renderList;
$("#sortBtn").onclick=()=>{sortMode=sortMode==="latest"?"price":sortMode==="price"?"name":"latest";$("#sortBtn").textContent=sortMode==="latest"?"最新":sortMode==="price"?"价格":"名称";renderList()}
$("#addBtn").onclick=()=>openForm();$("#quickAdd").onclick=()=>openForm();$("#menuBtn").onclick=()=>open("settingsModal");$("#manageGroups").onclick=manageGroups;
$("#exportBtn").onclick=exportData;$("#importBtn").onclick=()=>$("#importFile").click();
$("#clearBtn").onclick=()=>{if(confirm("确定清空全部数据吗？建议先导出备份")){state={items:[],groups:DEFAULT_GROUPS.slice(),diaries:[],profile:{name:"",bio:"",avatar:""}};save();currentGroup="全部";close("settingsModal");render();toast("全部数据已清空并保存")}}
async function exportData(){let data={app:"我的柜子",version:3,exportedAt:new Date().toISOString(),...state};let blob=new Blob([JSON.stringify(data)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="我的柜子完整备份_"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast("完整备份已导出")}
$("#importFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.items)||!Array.isArray(d.groups))throw Error();if(!confirm("导入会覆盖当前全部数据，确定吗？"))return;state={items:d.items,groups:d.groups.filter(x=>x!==FAV_GROUP),diaries:Array.isArray(d.diaries)?d.diaries:[],profile:d.profile||{name:"",bio:"",avatar:""}};save();render();toast("完整备份已恢复并保存")}catch(err){toast("备份文件格式不正确")}e.target.value=""};r.readAsText(f)}
$("#editProfile").onclick=openProfile;$("#profileBackup").onclick=()=>open("settingsModal");$("#addDiary").onclick=()=>openDiary();$("#quickDiary").onclick=()=>openDiary();
document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>close(b.dataset.close));
document.querySelectorAll(".modal-wrap").forEach(w=>w.addEventListener("click",e=>{if(e.target===w)w.classList.remove("show")}));
window.addEventListener("pagehide",()=>save());window.addEventListener("beforeunload",()=>save());document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save()});
load();render();updateBulk();
</script>
</body>
</html>
